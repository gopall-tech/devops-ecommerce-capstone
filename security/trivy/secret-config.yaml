# Trivy Secret Scanning Configuration
---
rules:
  - id: aws-access-key-id
    category: AWS
    title: AWS Access Key ID
    severity: CRITICAL
    regex: '(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'

  - id: aws-secret-access-key
    category: AWS
    title: AWS Secret Access Key
    severity: CRITICAL
    regex: '(?i)aws_secret_access_key\s*[=:]\s*["\']?([A-Za-z0-9/+=]{40})["\']?'

  - id: stripe-api-key
    category: Stripe
    title: Stripe API Key
    severity: CRITICAL
    regex: '(?i)(?:sk_live_|rk_live_)[A-Za-z0-9]{24,}'

  - id: jwt-secret
    category: JWT
    title: JWT Secret
    severity: HIGH
    regex: '(?i)(?:jwt[_-]?secret|token[_-]?secret)\s*[=:]\s*["\']?([A-Za-z0-9+/=]{20,})["\']?'

  - id: database-url
    category: Database
    title: Database Connection String
    severity: HIGH
    regex: '(?i)(?:postgres|mysql|mongodb)(?:ql)?://[^\s"'']+:[^\s"'']+@[^\s"'']+'

  - id: private-key
    category: Certificate
    title: Private Key
    severity: CRITICAL
    regex: '-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----'

  - id: github-token
    category: GitHub
    title: GitHub Token
    severity: HIGH
    regex: '(?:ghp_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9_]{36,}'

allow:
  paths:
    - "**/*.md"
    - "**/test/**"
    - "**/*_test.*"
    - "**/mock/**"
    - "**/example/**"

  values:
    - "PLACEHOLDER"
    - "example"
    - "test"
    - "dummy"
    - "fake"
