{{- if .Values.serviceAccount.create }}
{{- $services := list "userService" "productService" "cartService" "paymentService" "orderService" "apiGateway" }}
{{- range $serviceName := $services }}
{{- $service := index $.Values $serviceName }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ $.Values.global.aws.accountId }}:role/ecommerce-{{ $.Values.global.environment }}-{{ $service.name }}
{{- end }}
{{- end }}
{{- end }}
