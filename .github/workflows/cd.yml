# Continuous Deployment Workflow
name: CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'k8s/**'
      - 'helm/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: 'Service to deploy (all for all services)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - user-service
          - product-service
          - cart-service
          - payment-service
          - order-service
          - api-gateway

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: ecommerce-prod-eks

jobs:
  # Determine deployment parameters
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      services: ${{ steps.set-services.outputs.services }}
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set services to deploy
        id: set-services
        run: |
          if [ "${{ github.event.inputs.service }}" == "all" ] || [ -z "${{ github.event.inputs.service }}" ]; then
            echo 'services=["user-service","product-service","cart-service","payment-service","order-service","api-gateway"]' >> $GITHUB_OUTPUT
          else
            echo 'services=["${{ github.event.inputs.service }}"]' >> $GITHUB_OUTPUT
          fi

      - name: Set image tag
        id: set-tag
        run: |
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  # Deploy to environment
  deploy:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy with blue-green strategy
        run: |
          NAMESPACE="ecommerce-${{ needs.setup.outputs.environment }}"
          SERVICE="${{ matrix.service }}"
          IMAGE="${{ env.ECR_REGISTRY }}/ecommerce/${SERVICE}:${{ needs.setup.outputs.image-tag }}"

          # Create new (green) deployment
          kubectl set image deployment/${SERVICE} ${SERVICE}=${IMAGE} -n ${NAMESPACE}

          # Wait for rollout
          kubectl rollout status deployment/${SERVICE} -n ${NAMESPACE} --timeout=300s

          # Verify deployment health
          kubectl wait --for=condition=Available deployment/${SERVICE} -n ${NAMESPACE} --timeout=120s

      - name: Run smoke tests
        run: |
          NAMESPACE="ecommerce-${{ needs.setup.outputs.environment }}"
          SERVICE="${{ matrix.service }}"

          # Get service endpoint
          POD=$(kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/name=${SERVICE} -o jsonpath='{.items[0].metadata.name}')

          # Run health check
          kubectl exec -n ${NAMESPACE} ${POD} -- wget -q -O- http://localhost:3000/health || exit 1

          echo "Smoke tests passed for ${SERVICE}"

      - name: Send deployment notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "Deployment Update",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ matrix.service }}* deployed to *${{ needs.setup.outputs.environment }}*\nStatus: ${{ job.status }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # Run integration tests after deployment
  integration-tests:
    needs: [setup, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Run integration tests
        run: |
          NAMESPACE="ecommerce-${{ needs.setup.outputs.environment }}"

          # Port forward to API gateway
          kubectl port-forward -n ${NAMESPACE} svc/api-gateway 3005:3005 &
          sleep 5

          # Run tests
          npm run test:integration || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/

  # Promote to production (manual)
  promote-to-prod:
    needs: [setup, deploy, integration-tests]
    if: needs.setup.outputs.environment == 'staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for production
        run: |
          for service in user-service product-service cart-service payment-service order-service api-gateway; do
            SOURCE="${{ env.ECR_REGISTRY }}/ecommerce/${service}:${{ needs.setup.outputs.image-tag }}"
            TARGET="${{ env.ECR_REGISTRY }}/ecommerce/${service}:prod-${{ needs.setup.outputs.image-tag }}"

            docker pull ${SOURCE}
            docker tag ${SOURCE} ${TARGET}
            docker push ${TARGET}
          done

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          NAMESPACE="ecommerce-prod"
          TAG="prod-${{ needs.setup.outputs.image-tag }}"

          for service in user-service product-service cart-service payment-service order-service api-gateway; do
            IMAGE="${{ env.ECR_REGISTRY }}/ecommerce/${service}:${TAG}"
            kubectl set image deployment/${service} ${service}=${IMAGE} -n ${NAMESPACE}
            kubectl rollout status deployment/${service} -n ${NAMESPACE} --timeout=300s
          done

      - name: Create release tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/release-${context.sha.substring(0, 7)}`,
              sha: context.sha
            })
