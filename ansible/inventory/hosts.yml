# Ansible Inventory
---
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/ecommerce-key.pem
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Development Environment
    dev:
      children:
        dev_webservers:
          hosts:
            dev-web-01:
              ansible_host: 10.0.1.10
        dev_databases:
          hosts:
            dev-db-01:
              ansible_host: 10.0.2.10

    # Staging Environment
    staging:
      children:
        staging_webservers:
          hosts:
            staging-web-01:
              ansible_host: 10.1.1.10
            staging-web-02:
              ansible_host: 10.1.1.11
        staging_databases:
          hosts:
            staging-db-01:
              ansible_host: 10.1.2.10
        staging_loadbalancers:
          hosts:
            staging-lb-01:
              ansible_host: 10.1.0.10

    # Production Environment
    prod:
      children:
        prod_webservers:
          hosts:
            prod-web-01:
              ansible_host: 10.2.1.10
            prod-web-02:
              ansible_host: 10.2.1.11
            prod-web-03:
              ansible_host: 10.2.1.12
        prod_databases:
          hosts:
            prod-db-01:
              ansible_host: 10.2.2.10
            prod-db-02:
              ansible_host: 10.2.2.11
        prod_loadbalancers:
          hosts:
            prod-lb-01:
              ansible_host: 10.2.0.10
            prod-lb-02:
              ansible_host: 10.2.0.11
        prod_monitoring:
          hosts:
            prod-mon-01:
              ansible_host: 10.2.3.10

    # Group Mappings
    webservers:
      children:
        dev_webservers:
        staging_webservers:
        prod_webservers:

    databases:
      children:
        dev_databases:
        staging_databases:
        prod_databases:

    loadbalancers:
      children:
        staging_loadbalancers:
        prod_loadbalancers:

    monitoring:
      children:
        prod_monitoring:
