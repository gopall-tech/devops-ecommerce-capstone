# Secrets Template (encrypt with ansible-vault before committing)
# Run: ansible-vault encrypt ansible/vault/secrets.yml
---
# Database credentials
database:
  postgres:
    host: "{{ lookup('aws_ssm', '/ecommerce/prod/db/host') }}"
    port: 5432
    username: "{{ lookup('aws_ssm', '/ecommerce/prod/db/username') }}"
    password: "{{ lookup('aws_ssm', '/ecommerce/prod/db/password', decrypt=true) }}"
    database: ecommerce

# Redis credentials
redis:
  host: "{{ lookup('aws_ssm', '/ecommerce/prod/redis/host') }}"
  port: 6379
  password: "{{ lookup('aws_ssm', '/ecommerce/prod/redis/password', decrypt=true) }}"

# JWT secrets
jwt:
  secret: "{{ lookup('aws_ssm', '/ecommerce/prod/jwt/secret', decrypt=true) }}"
  refresh_secret: "{{ lookup('aws_ssm', '/ecommerce/prod/jwt/refresh_secret', decrypt=true) }}"

# Stripe credentials
stripe:
  secret_key: "{{ lookup('aws_ssm', '/ecommerce/prod/stripe/secret_key', decrypt=true) }}"
  webhook_secret: "{{ lookup('aws_ssm', '/ecommerce/prod/stripe/webhook_secret', decrypt=true) }}"

# AWS credentials (for services)
aws:
  access_key_id: "{{ lookup('aws_ssm', '/ecommerce/prod/aws/access_key_id', decrypt=true) }}"
  secret_access_key: "{{ lookup('aws_ssm', '/ecommerce/prod/aws/secret_access_key', decrypt=true) }}"

# Monitoring credentials
monitoring:
  grafana_admin_password: "{{ lookup('aws_ssm', '/ecommerce/prod/grafana/admin_password', decrypt=true) }}"
  alertmanager_slack_webhook: "{{ lookup('aws_ssm', '/ecommerce/prod/alertmanager/slack_webhook', decrypt=true) }}"

# SSL certificates
ssl:
  certificate: "{{ lookup('file', '/path/to/certificate.pem') }}"
  private_key: "{{ lookup('file', '/path/to/private-key.pem') }}"
