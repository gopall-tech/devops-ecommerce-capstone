# Secrets Synchronization Playbook
# Syncs secrets from AWS Secrets Manager to Kubernetes
---
- name: Sync Secrets to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    environment: "{{ deploy_env | default('prod') }}"
    namespace: "ecommerce-{{ environment }}"
    aws_region: "{{ region | default('us-east-1') }}"

  tasks:
    - name: Get secrets from AWS Secrets Manager
      amazon.aws.aws_secret:
        name: "ecommerce/{{ environment }}/{{ item.name }}"
        region: "{{ aws_region }}"
      register: secrets
      loop:
        - { name: 'user-service', k8s_secret: 'user-service-secrets' }
        - { name: 'product-service', k8s_secret: 'product-service-secrets' }
        - { name: 'cart-service', k8s_secret: 'cart-service-secrets' }
        - { name: 'payment-service', k8s_secret: 'payment-service-secrets' }
        - { name: 'order-service', k8s_secret: 'order-service-secrets' }
        - { name: 'api-gateway', k8s_secret: 'api-gateway-secrets' }
      no_log: true

    - name: Create Kubernetes secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.item.k8s_secret }}"
            namespace: "{{ namespace }}"
          type: Opaque
          stringData: "{{ item.secret | from_json }}"
      loop: "{{ secrets.results }}"
      no_log: true

    - name: Restart deployments to pick up new secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ item }}"
            namespace: "{{ namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  secrets-updated: "{{ ansible_date_time.iso8601 }}"
      loop:
        - user-service
        - product-service
        - cart-service
        - payment-service
        - order-service
        - api-gateway
      when: restart_deployments | default(false) | bool
