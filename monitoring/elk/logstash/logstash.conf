# Logstash Pipeline Configuration

input {
  # Receive logs from Fluentd/Filebeat
  beats {
    port => 5044
    ssl => false
  }

  # Receive logs directly via TCP
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON logs from Node.js services
  if [kubernetes][labels][app_kubernetes_io/part-of] == "ecommerce" {
    json {
      source => "message"
      target => "parsed"
    }

    # Extract common fields
    mutate {
      add_field => {
        "service" => "%{[kubernetes][labels][app_kubernetes_io/name]}"
        "namespace" => "%{[kubernetes][namespace]}"
        "pod" => "%{[kubernetes][pod][name]}"
      }
    }

    # Parse timestamp
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    # Extract log level
    if [parsed][level] {
      mutate {
        add_field => { "log_level" => "%{[parsed][level]}" }
      }
    }

    # Parse request logs
    if [parsed][method] {
      mutate {
        add_field => {
          "http_method" => "%{[parsed][method]}"
          "http_path" => "%{[parsed][url]}"
          "http_status" => "%{[parsed][statusCode]}"
          "response_time_ms" => "%{[parsed][responseTime]}"
        }
      }
      mutate {
        convert => {
          "http_status" => "integer"
          "response_time_ms" => "float"
        }
      }
    }

    # Parse error logs
    if [parsed][error] {
      mutate {
        add_field => {
          "error_message" => "%{[parsed][error][message]}"
          "error_stack" => "%{[parsed][error][stack]}"
        }
      }
    }

    # Geoip lookup for client IPs
    if [parsed][clientIp] {
      geoip {
        source => "[parsed][clientIp]"
        target => "geoip"
      }
    }

    # Add request ID for tracing
    if [parsed][requestId] {
      mutate {
        add_field => { "request_id" => "%{[parsed][requestId]}" }
      }
    }

    # Remove raw parsed field
    mutate {
      remove_field => ["parsed"]
    }
  }

  # Add environment tag
  if [namespace] =~ "prod" {
    mutate { add_tag => ["production"] }
  } else if [namespace] =~ "staging" {
    mutate { add_tag => ["staging"] }
  } else {
    mutate { add_tag => ["development"] }
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    index => "ecommerce-%{[namespace]}-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "ecommerce"
    ilm_pattern => "000001"
    ilm_policy => "ecommerce-ilm-policy"
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
