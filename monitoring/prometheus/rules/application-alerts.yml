# Application Alerting Rules
groups:
  - name: application.rules
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has >5% error rate (current: {{ $value | humanizePercentage }})"

      # High latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "P99 latency is {{ $value }}s on {{ $labels.service }}"

      # Service down
      - alert: ServiceDown
        expr: up{job="kubernetes-pods"} == 0
        for: 1m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.service }} in {{ $labels.kubernetes_namespace }} has been down for >1 minute"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          container_memory_usage_bytes{namespace=~"ecommerce-.*"}
          / container_spec_memory_limit_bytes{namespace=~"ecommerce-.*"} > 0.9
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "High memory usage in {{ $labels.pod }}"
          description: "Memory usage is {{ $value | humanizePercentage }} of limit"

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace=~"ecommerce-.*"}[5m])) by (pod)
          / sum(container_spec_cpu_quota{namespace=~"ecommerce-.*"}/container_spec_cpu_period{namespace=~"ecommerce-.*"}) by (pod) > 0.9
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "High CPU usage in {{ $labels.pod }}"
          description: "CPU usage is {{ $value | humanizePercentage }} of limit"

      # Pod restart loop
      - alert: PodRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace=~"ecommerce-.*"}[1h]) > 5
        for: 5m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "Pod {{ $labels.pod }} is in a restart loop"
          description: "{{ $labels.pod }} has restarted {{ $value }} times in the last hour"

      # Deployment replicas mismatch
      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_status_replicas_available{namespace=~"ecommerce-.*"}
          != kube_deployment_spec_replicas{namespace=~"ecommerce-.*"}
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Deployment {{ $labels.deployment }} replicas mismatch"
          description: "Available: {{ $value }}, Desired: {{ printf `kube_deployment_spec_replicas{deployment=\"%s\"}` $labels.deployment | query | first | value }}"

  - name: database.rules
    rules:
      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool is >80% full"
          description: "{{ $value | humanizePercentage }} of connections in use"

      # Slow queries
      - alert: SlowQueries
        expr: |
          rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 30
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Slow database queries detected"

      # Redis high memory
      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of max memory"

  - name: business.rules
    rules:
      # Order processing failures
      - alert: OrderProcessingFailures
        expr: |
          sum(rate(order_processing_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Order processing errors detected"
          description: "{{ $value }} errors/second in order processing"

      # Payment failures
      - alert: HighPaymentFailureRate
        expr: |
          sum(rate(payment_failures_total[5m]))
          / sum(rate(payment_attempts_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Payment failure rate is above 10%"
          description: "Current failure rate: {{ $value | humanizePercentage }}"

      # Cart abandonment spike
      - alert: CartAbandonmentSpike
        expr: |
          sum(rate(cart_abandoned_total[1h]))
          / sum(rate(cart_created_total[1h])) > 0.8
        for: 30m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Cart abandonment rate is unusually high"
