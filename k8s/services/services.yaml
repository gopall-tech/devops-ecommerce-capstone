# Kubernetes Services for E-Commerce Platform
---
# User Service
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: user-service
---
# Product Service
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: product-service
---
# Cart Service
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cart-service
---
# Payment Service
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: payment-service
---
# Order Service
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3004
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: order-service
---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ecommerce
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3005
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: api-gateway
