# Istio Peer Authentication - mTLS Configuration
---
# Namespace-wide strict mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: ecommerce-prod
spec:
  mtls:
    mode: STRICT
---
# Authorization Policies
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
    - from:
        - source:
            namespaces: ["monitoring"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: user-service-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce-prod/sa/api-gateway"
              - "cluster.local/ns/ecommerce-prod/sa/order-service"
    - from:
        - source:
            namespaces: ["monitoring"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: product-service-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce-prod/sa/api-gateway"
              - "cluster.local/ns/ecommerce-prod/sa/cart-service"
              - "cluster.local/ns/ecommerce-prod/sa/order-service"
    - from:
        - source:
            namespaces: ["monitoring"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: cart-service-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce-prod/sa/api-gateway"
              - "cluster.local/ns/ecommerce-prod/sa/order-service"
    - from:
        - source:
            namespaces: ["monitoring"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: payment-service-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce-prod/sa/api-gateway"
    - from:
        - source:
            namespaces: ["monitoring"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: order-service-policy
  namespace: ecommerce-prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/ecommerce-prod/sa/api-gateway"
              - "cluster.local/ns/ecommerce-prod/sa/payment-service"
    - from:
        - source:
            namespaces: ["monitoring"]
