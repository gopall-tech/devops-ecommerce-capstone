  http:
    - route:
        - destination:
            host: product-service
            port:
              number: 3001
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 5s
---
# Cart Service Virtual Service
apiVersion: networking.istio.io/v1beta1
