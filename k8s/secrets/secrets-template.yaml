# Secret Templates for E-Commerce Platform
# NOTE: These are templates. Actual secrets should be managed via:
# 1. External Secrets Operator with AWS Secrets Manager
# 2. Sealed Secrets
# 3. Vault
#
# DO NOT commit actual secret values to git!
---
# User Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@host:5432/users?schema=public"
  jwt-secret: "<JWT_SECRET_PLACEHOLDER>"
  jwt-refresh-secret: "<JWT_REFRESH_SECRET_PLACEHOLDER>"
---
# Product Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@host:5432/products?schema=public"
---
# Cart Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: cart-service-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  redis-url: "redis://:password@host:6379"
---
# Payment Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@host:5432/payments?schema=public"
  stripe-secret-key: "<STRIPE_SECRET_KEY_PLACEHOLDER>"
  stripe-webhook-secret: "<STRIPE_WEBHOOK_SECRET_PLACEHOLDER>"
  encryption-key: "<ENCRYPTION_KEY_PLACEHOLDER>"
---
# Order Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@host:5432/orders?schema=public"
---
# API Gateway Secrets
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  jwt-secret: "<JWT_SECRET_PLACEHOLDER>"
