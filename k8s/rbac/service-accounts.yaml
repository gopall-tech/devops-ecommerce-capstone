# Service Accounts for E-Commerce Platform
---
# CI/CD Deployer Service Account - Dev
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: ci-cd
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ecommerce-dev-ci-deployer
---
# CI/CD Deployer Service Account - Staging
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ecommerce-staging
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: ci-cd
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ecommerce-staging-ci-deployer
---
# CI/CD Deployer Service Account - Prod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: ci-cd
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ecommerce-prod-ci-deployer
---
