# Role Bindings for E-Commerce Platform
---
# Admin binding for DevOps team
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecommerce-admin-binding
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-admin
subjects:
  - kind: Group
    name: devops-team
    apiGroup: rbac.authorization.k8s.io
---
# Developer binding for dev namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding-dev
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-developer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
---
# Developer binding for staging namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding-staging
  namespace: ecommerce-staging
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-developer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
---
# Viewer binding for prod namespace (developers can only view prod)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-viewer-binding-prod
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-viewer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
---
# CI/CD Service Account binding for deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding-dev
  namespace: ecommerce-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ecommerce-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding-staging
  namespace: ecommerce-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ecommerce-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding-prod
  namespace: ecommerce-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecommerce-ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ecommerce-prod
