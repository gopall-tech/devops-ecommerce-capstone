# Vertical Pod Autoscalers for E-Commerce Platform
# VPA automatically adjusts CPU and memory requests/limits
---
# User Service VPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: user-service-vpa
  namespace: ecommerce-prod
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: autoscaling
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  updatePolicy:
    updateMode: "Off" # Recommendation only, manual updates
  resourcePolicy:
    containerPolicies:
      - containerName: user-service
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 2
          memory: 4Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
---
