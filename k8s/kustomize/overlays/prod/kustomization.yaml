# Production Environment Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ecommerce-prod

namespace: ecommerce-prod

resources:
  - ../../base
  - namespace.yaml
  - ../../network-policies/
  - ../../autoscaling/

commonLabels:
  app.kubernetes.io/environment: prod

commonAnnotations:
  environment: production

# Image transformations for prod
images:
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/user-service
    newTag: v1.0.0
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/product-service
    newTag: v1.0.0
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/cart-service
    newTag: v1.0.0
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/payment-service
    newTag: v1.0.0
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/order-service
    newTag: v1.0.0
  - name: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce/api-gateway
    newTag: v1.0.0

# Patches for prod environment
patches:
  # 3 replicas for prod
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: ".*"

  # Enable topology spread for prod
  - patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/environment: prod
    target:
      kind: Deployment
      name: ".*"

configMapGenerator:
  - name: prod-environment-config
    literals:
      - LOG_LEVEL=info
      - DEBUG_MODE=false
      - MAINTENANCE_MODE=false
