# Base Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ecommerce-base

resources:
  - ../../deployments/user-service.yaml
  - ../../deployments/product-service.yaml
  - ../../deployments/cart-service.yaml
  - ../../deployments/payment-service.yaml
  - ../../deployments/order-service.yaml
  - ../../deployments/api-gateway.yaml
  - ../../services/services.yaml
  - ../../configmaps/shared-config.yaml
  - ../../configmaps/service-configs.yaml

commonLabels:
  app.kubernetes.io/part-of: ecommerce
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
