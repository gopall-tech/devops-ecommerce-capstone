# Staging Namespace Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-staging
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/environment: staging
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Staging environment for e-commerce platform"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-resource-quota
  namespace: ecommerce-staging
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    secrets: "100"
    configmaps: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limit-range
  namespace: ecommerce-staging
spec:
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "4"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
