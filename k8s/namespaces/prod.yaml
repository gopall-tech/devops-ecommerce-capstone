# Production Namespace Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-prod
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/environment: prod
    app.kubernetes.io/managed-by: kubectl
    istio-injection: enabled
  annotations:
    description: "Production environment for e-commerce platform"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-resource-quota
  namespace: ecommerce-prod
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    persistentvolumeclaims: "50"
    pods: "200"
    services: "50"
    secrets: "200"
    configmaps: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-limit-range
  namespace: ecommerce-prod
spec:
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "250m"
        memory: "512Mi"
      type: Container
    - max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      type: Container
