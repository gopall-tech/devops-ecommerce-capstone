# Development Namespace Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-dev
  labels:
    app.kubernetes.io/name: ecommerce
    app.kubernetes.io/environment: dev
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Development environment for e-commerce platform"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-resource-quota
  namespace: ecommerce-dev
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limit-range
  namespace: ecommerce-dev
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
    - max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
